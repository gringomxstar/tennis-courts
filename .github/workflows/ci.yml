name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Linting check
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Next.js build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/tennis_test?sslmode=disable"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/tennis_test?sslmode=disable"
          AUTH_SECRET: "ci-secret-for-build-test-only-key-32chars"
